<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 550" width="970" height="550" role="img" aria-labelledby="ttl">
<title id="ttl">nawaban 架构：agent 会话加载 skill、调用 CLI，并受 hook 检查；CLI 读写 SQLite 数据库；hook 只读它；看板服务读它并提供你回答问题的网页。</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle;fill:#1f2328}
.t{font-size:15px;font-weight:600} .s,.l{font-size:12px;fill:#59636e} .r{font-size:13px;text-anchor:start}
.bg{fill:#fff;stroke:#d1d9e0} .box{fill:#fff;stroke:#8c959f;stroke-width:1.5}
.ag .box{stroke:#0969da;stroke-width:2} .hu .box{stroke:#bc4c00;stroke-width:2}
.db .box{fill:#f6f8fa;stroke:#59636e;stroke-width:1.5}
.e{fill:none;stroke-width:2;stroke-dasharray:6 6;animation:m 1.2s linear infinite}
.b{stroke:#0969da} .o{stroke:#bc4c00} .g{stroke:#59636e}
@keyframes m{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion:reduce){.e{animation:none}}
</style>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="969" height="549" rx="8"/>
<g class="ag"><rect class="box" x="30" y="150" width="190" height="100" rx="8"/><text class="t" x="125.0" y="196.0">Agent 会话</text><text class="s" x="125.0" y="216.0">Claude Code 或 Codex</text></g>
<g class="hu"><rect class="box" x="30" y="408" width="190" height="64" rx="8"/><text class="t" x="125.0" y="436.0">你</text><text class="s" x="125.0" y="456.0">在浏览器里</text></g>
<g class=""><rect class="box" x="340" y="48" width="240" height="64" rx="8"/><text class="t" x="460.0" y="76.0">Skill</text><text class="s" x="460.0" y="96.0">agent 加载的 4 份操作说明</text></g>
<g class=""><rect class="box" x="340" y="168" width="240" height="64" rx="8"/><text class="t" x="460.0" y="196.0">Hook</text><text class="s" x="460.0" y="216.0">开场横幅、闸门、worker 回信</text></g>
<g class=""><rect class="box" x="340" y="288" width="240" height="64" rx="8"/><text class="t" x="460.0" y="316.0">CLI</text><text class="s" x="460.0" y="336.0">Python，所有任务写入都走它</text></g>
<g class=""><rect class="box" x="340" y="408" width="240" height="64" rx="8"/><text class="t" x="460.0" y="436.0">看板</text><text class="s" x="460.0" y="456.0">Python 服务加 React 网页</text></g>
<path class="e b" marker-end="url(#mb)" d="M338 80H125V148"/><text class="l" x="232" y="72">加载</text>
<path class="e b" marker-end="url(#mb)" d="M338 200H222"/><text class="l" x="280" y="192">检查每次工具调用</text>
<path class="e b" marker-end="url(#mb)" d="M125 252V320H338"/><text class="l" x="232" y="312">执行命令</text>
<path class="e o" marker-end="url(#mo)" d="M222 440H338"/><text class="l" x="280" y="432">打开</text>
<g class="db"><rect class="box" x="720" y="150" width="220" height="330" rx="8"/><text class="t" x="830.0" y="182">数据库</text><text class="s" x="830.0" y="202">SQLite 文件</text></g>
<path d="M740 220H920" stroke="#d1d9e0"/>
<text class="r" x="748" y="254">任务卡</text>
<text class="r" x="748" y="286">事件与决定</text>
<text class="r" x="748" y="318">依赖关系</text>
<text class="r" x="748" y="350">收件箱提问</text>
<text class="r" x="748" y="382">worker 来信</text>
<path class="e g" marker-end="url(#mg)" d="M718 200H582"/><text class="l" x="651.0" y="192">读；写来信</text>
<path class="e g" marker-start="url(#mg)" marker-end="url(#mg)" d="M582 320H718"/><text class="l" x="651.0" y="312">读写</text>
<path class="e g" marker-start="url(#mg)" marker-end="url(#mg)" d="M582 440H718"/><text class="l" x="651.0" y="432">读；写回答</text>
<text class="l" x="485" y="522">蓝线：agent 一侧。  橙线：你一侧。  灰线：对数据库的读写。</text>
</svg>
