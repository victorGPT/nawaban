<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 470" width="970" height="470" role="img" aria-labelledby="ttl">
<title id="ttl">How nawaban coordinates agents: an agent claims a task card, works in its own worktree and opens a pull request; three gates block collisions; questions go to your inbox; the board records every step.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;text-anchor:middle;fill:#1f2328}
.t{font-size:15px;font-weight:600} .s{font-size:12px;fill:#59636e} .l{font-size:12px;fill:#59636e}
.bg{fill:#fff;stroke:#d1d9e0} .box{fill:#fff;stroke:#8c959f;stroke-width:1.5}
.gate .box{fill:#f6f8fa;stroke:#59636e;stroke-dasharray:4 3}
.hum .box{stroke:#bc4c00} .board{fill:#f6f8fa;stroke:#d1d9e0}
.flow{fill:none;stroke:#0969da;stroke-width:2;stroke-dasharray:6 6;animation:march 1.2s linear infinite}
.ask{fill:none;stroke:#bc4c00;stroke-width:2;stroke-dasharray:6 6;animation:march 1.2s linear infinite}
.tie{stroke:#59636e;stroke-width:1.5}
.step .box{animation:lit 10s linear infinite}
.d1 .box{animation-delay:0s} .d2 .box{animation-delay:2s} .d3 .box{animation-delay:4s} .d4 .box{animation-delay:6s} .d5 .box{animation-delay:8s}
@keyframes march{to{stroke-dashoffset:-12}}
@keyframes lit{0%,18%{stroke:#0969da;stroke-width:3}22%,100%{stroke:#8c959f;stroke-width:1.5}}
@media (prefers-reduced-motion:reduce){.flow,.ask,.step .box{animation:none}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bc4c00"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="969" height="469" rx="8"/>
<g class="step d1"><rect class="box" x="30" y="40" width="150" height="64" rx="8"/><text class="t" x="105.0" y="68.0">Agent session</text><text class="s" x="105.0" y="88.0">Claude Code or Codex</text></g>
<path class="flow" marker-end="url(#a)" d="M180 72H218"/>
<g class="step d2"><rect class="box" x="220" y="40" width="150" height="64" rx="8"/><text class="t" x="295.0" y="68.0">Task card</text><text class="s" x="295.0" y="88.0">claimed before editing</text></g>
<path class="flow" marker-end="url(#a)" d="M370 72H408"/>
<g class="step d3"><rect class="box" x="410" y="40" width="150" height="64" rx="8"/><text class="t" x="485.0" y="68.0">Worktree</text><text class="s" x="485.0" y="88.0">one per card</text></g>
<path class="flow" marker-end="url(#a)" d="M560 72H598"/>
<g class="step d4"><rect class="box" x="600" y="40" width="150" height="64" rx="8"/><text class="t" x="675.0" y="68.0">Pull request</text><text class="s" x="675.0" y="88.0">reviewed and merged</text></g>
<path class="flow" marker-end="url(#a)" d="M750 72H788"/>
<g class="step d5"><rect class="box" x="790" y="40" width="150" height="64" rx="8"/><text class="t" x="865.0" y="68.0">Done</text><text class="s" x="865.0" y="88.0">evidence on the card</text></g>
<path class="tie" d="M295 104V156"/><text class="l" x="321" y="134">blocks</text>
<g class="gate"><rect class="box" x="205" y="156" width="180" height="56" rx="8"/><text class="t" x="295.0" y="180.0">Claim gate</text><text class="s" x="295.0" y="200.0">upstream card unfinished</text></g>
<path class="tie" d="M485 104V156"/><text class="l" x="511" y="134">blocks</text>
<g class="gate"><rect class="box" x="395" y="156" width="180" height="56" rx="8"/><text class="t" x="485.0" y="180.0">Write and branch gate</text><text class="s" x="485.0" y="200.0">main checkout untouched</text></g>
<path class="tie" d="M675 104V156"/><text class="l" x="701" y="134">blocks</text>
<g class="gate"><rect class="box" x="585" y="156" width="180" height="56" rx="8"/><text class="t" x="675.0" y="180.0">Merge gate</text><text class="s" x="675.0" y="200.0">checks not green</text></g>
<path class="ask" marker-end="url(#b)" d="M120 104V292H298"/><text class="l" x="210" y="284">asks once, with evidence</text>
<g class="hum"><rect class="box" x="300" y="260" width="170" height="64" rx="8"/><text class="t" x="385.0" y="288.0">Inbox</text><text class="s" x="385.0" y="308.0">one queue for your decisions</text></g>
<path class="ask" marker-end="url(#b)" d="M470 292H538"/>
<g class="hum"><rect class="box" x="540" y="260" width="170" height="64" rx="8"/><text class="t" x="625.0" y="288.0">You</text><text class="s" x="625.0" y="308.0">decide, authorize, accept</text></g>
<path class="ask" marker-end="url(#b)" d="M625 324V360H60V106"/><text class="l" x="342" y="352">your answer returns to the agent</text>
<rect class="board" x="30" y="392" width="910" height="52" rx="8"/><text class="t" x="80" y="423">Board</text><text class="s" x="520" y="423">SQLite file and local web page. Every claim, block, question and answer is recorded here.</text>
</svg>
