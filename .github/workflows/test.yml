name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test herdr/mods/nawaban-board/*.test.js
      - run: uv run --no-project --python 3.12 --with pytest python -m pytest -q tests
