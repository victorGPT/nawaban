name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  web-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix nawaban/webui ci
      - run: npm --prefix nawaban/webui run build
      - run: npm --prefix nawaban/webui run lint
      - run: npm --prefix nawaban/webui test
      - run: npm --prefix nawaban/webui run test:components
      - run: npm --prefix nawaban/webui run test:proxy
      - run: uv run --no-project --python 3.12 --with pytest python -m pytest -q tests
      - run: uv run --no-project --python 3.12 --with pytest --with pyyaml python tests/run.py
