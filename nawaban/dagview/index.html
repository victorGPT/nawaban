<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>nawaban · DAG</title>
<script src="./vendor/dagre-0.8.5.min.js"></script>
<style>
:root{
  --bg:#0f1011;--surface:#161719;--surface-2:#1c1d1f;--surface-3:#232426;
  --fg:#e8e8ea;--muted:#9b9ba1;--dim:#6b6b72;
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.10);
  --accent:#5e6ad2;--accent-soft:rgba(94,106,210,.18);
  --red:#eb5757;--green:#4cb782;--amber:#d19a00;--blue:#3b82f6;--violet:#a855f7;
  --speed:.12s
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;overflow:hidden}
#graph{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#graph.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#nodes{position:absolute;left:0;top:0}
.gnode{
  position:absolute;width:228px;height:72px;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--dim);
  border-radius:10px;padding:8px 10px 7px;text-align:left;color:inherit;font:inherit;
  cursor:pointer;overflow:hidden;
  transition:background var(--speed),border-color var(--speed),opacity var(--speed),box-shadow var(--speed)
}
.gnode:hover{background:var(--surface-2);border-color:var(--line-2)}
.gnode.sel{border-color:rgba(94,106,210,.55);box-shadow:0 0 0 1px rgba(94,106,210,.35);background:var(--surface-2)}
.gnode.is-root{box-shadow:0 0 0 1px rgba(94,106,210,.55)}
.gnode.done{opacity:.48}
.gnode.dim{opacity:.14}
.gnode.hit{box-shadow:0 0 0 1px rgba(94,106,210,.45)}
.gtitle{font-weight:500;font-size:13px;line-height:1.3;max-height:2.6em;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.gid{font:10.5px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
  margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:11px;color:var(--dim);margin-top:2px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tag{border-radius:999px;padding:0 6px;font-size:10px;font-weight:500;line-height:16px}
.tag.red{background:rgba(235,87,87,.14);color:var(--red);border:1px solid rgba(235,87,87,.28)}
.tag.grey{background:var(--surface-3);color:var(--muted)}
.gnode.decision{animation:rail 1.8s ease-in-out infinite}
@keyframes rail{0%,100%{border-left-color:#eb5757}50%{border-left-color:#ffb0b0}}
@media (prefers-reduced-motion:reduce){
  .gnode.decision{animation:none}
  .edge-dep{stroke-dasharray:none!important;animation:none!important}
}
.edge-dep{fill:none;stroke:rgba(94,106,210,.55);stroke-width:1.6;stroke-dasharray:5 8;
  animation:flow 1.1s linear infinite}
.edge-rel{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1;stroke-dasharray:3 5}
.edge-dim{opacity:.12}
@keyframes flow{to{stroke-dashoffset:-26}}
.hud{position:fixed;z-index:5;background:rgba(15,16,17,.92);border:1px solid var(--line);border-radius:10px}
#topbar{top:12px;left:12px;right:12px;display:flex;flex-direction:column;gap:8px;padding:8px 12px}
#topbar .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:14px;font-weight:600}
h1 a{color:inherit;text-decoration:none}
.nav-back{color:var(--dim);font-size:12px;text-decoration:none;border:1px solid var(--line);
  border-radius:6px;padding:4px 10px}
.nav-back:hover{color:var(--fg);background:var(--surface-2)}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  background:var(--surface);border:1px solid var(--line);color:var(--dim);font-size:12px;
  font-variant-numeric:tabular-nums}
.chip b{color:var(--fg);font-weight:600}
.chip.warn b{color:var(--amber)}
#search-wrap{position:relative;flex:1 1 260px;min-width:180px;max-width:480px}
#search-wrap .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
#q{width:100%;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:6px;padding:7px 64px 7px 30px;font:inherit;outline:none}
#q:focus{border-color:rgba(94,106,210,.5)}
#search-meta{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px}
#search-count{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;padding:0 4px}
#search-count.has-hits{color:var(--accent)}
#search-count.none{color:var(--red)}
#btn-clear-q{appearance:none;border:0;background:transparent;color:var(--dim);cursor:pointer;
  width:22px;height:22px;border-radius:6px;display:none}
#btn-clear-q.show{display:grid;place-items:center}
#search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:min(360px,50vh);
  overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 16px 40px rgba(0,0,0,.45);display:none;z-index:30}
#search-results.open{display:block}
#search-results .hit{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 12px;
  cursor:pointer;border-bottom:1px solid var(--line)}
#search-results .hit:hover,#search-results .hit.active{background:var(--accent-soft)}
#search-results .idx{font-size:10px;color:var(--dim);grid-row:span 2;align-self:center}
#search-results .tid{font:11px ui-monospace,monospace;color:var(--accent)}
#search-results .ttl{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search-results .sub{grid-column:2;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#search-results .empty{padding:14px 12px;color:var(--dim);text-align:center}
#search-results mark{background:rgba(209,154,0,.25);color:#e2c070;border-radius:2px}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.controls label{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;
  color:var(--dim);cursor:pointer;user-select:none;font-size:12px}
.controls label:hover{color:var(--fg);background:var(--surface-2)}
.controls input{accent-color:var(--accent)}
button.btn,a.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;text-decoration:none}
button.btn:hover,a.btn:hover{background:var(--surface-2)}
#ego-bar{display:none;align-items:center;gap:8px;flex-wrap:wrap}
#ego-bar.on{display:flex}
#detail{top:108px;right:12px;width:320px;max-height:calc(100vh - 130px);padding:14px 16px;
  overflow:auto;display:none}
#detail.open{display:block}
#detail h2{margin:0 0 4px;font-size:15px;font-weight:600;word-break:break-word}
#detail .id{font:11px ui-monospace,monospace;color:var(--dim);margin-bottom:10px}
#detail .meta{display:grid;grid-template-columns:88px 1fr;gap:6px 8px;font-size:12px;margin-bottom:10px}
#detail .meta dt{color:var(--dim)}
#detail .meta dd{margin:0;word-break:break-word}
#detail .tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
#detail .list{margin:8px 0 0;padding:0;list-style:none}
#detail .list li{padding:6px 0;border-top:1px solid var(--line);font-size:12px;color:var(--dim);cursor:pointer}
#detail .list li:hover{color:var(--fg)}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);color:var(--dim)}
#loading.hidden{display:none}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:5;
  color:var(--dim);font-size:11px;pointer-events:none;background:rgba(15,16,17,.9);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px}
kbd{font:10px ui-monospace,monospace;border:1px solid var(--line-2);border-radius:3px;padding:0 4px}
</style>
</head>
<body>
<div id="loading">读图…</div>
<div id="graph">
  <div id="stage">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="nodes"></div>
  </div>
</div>

<header id="topbar" class="hud">
  <div class="row">
    <h1><a href="/">NAWABAN</a> · DAG</h1>
    <a class="nav-back" href="/">← Board</a>
    <div id="search-wrap">
      <span class="si" aria-hidden="true">⌕</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
        placeholder="找寻 id / title / owner / epic  ·  /" aria-label="找寻任务" />
      <div id="search-meta">
        <span id="search-count"></span>
        <button type="button" id="btn-clear-q" title="清除 (Esc)" aria-label="清除">×</button>
      </div>
      <div id="search-results" role="listbox" aria-label="搜寻结果"></div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="row controls">
    <label><input type="checkbox" id="f-decision" checked /> 等拍板</label>
    <label><input type="checkbox" id="f-blocked" checked /> 阻塞</label>
    <label><input type="checkbox" id="f-frontier" checked /> frontier</label>
    <label><input type="checkbox" id="f-active" checked /> 进行中</label>
    <label><input type="checkbox" id="f-done" checked /> 完成</label>
    <label id="fold-wrap"><input type="checkbox" id="f-fold" checked /> 按功能折叠</label>
    <span class="chip" id="lonely-chip"></span>
    <div id="ego-bar">
      <span class="chip">本卡 <b id="ego-root"></b></span>
      <span class="chip" id="ego-meta"></span>
      <a class="btn" id="ego-full" href="/?view=dag">全图</a>
    </div>
    <button class="btn" id="btn-fit" type="button">Fit</button>
  </div>
</header>

<aside id="detail" class="hud"></aside>
<div id="hint"><kbd>滚轮</kbd> 缩放 · 拖空白平移 · 点卡详情 · <kbd>/</kbd> 找寻</div>

<script>
(() => {
  const ROLE_COLOR = {
    decision: '#eb5757',
    blocked:  '#eb5757',
    frontier: '#5e6ad2',
    active:   '#3b82f6',
    staging:  '#c0392b',
    open:     '#8a8a8a',
    done:     '#2e9e5b',
  };
  const CARD_W = 228, CARD_H = 72;

  const params = new URLSearchParams(location.search);
  const FOCUS_ROOT = (params.get('focus') || params.get('root') || '').trim();

  let raw = null;
  let viewNodes = [];
  const filters = {
    decision: true, blocked: true, frontier: true, active: true,
    // 折叠视图默认隐去纯 done 的历史功能组(实测 113 组里 68 个是它们);
    // 平铺视图保持原样 —— 那本来就是给人翻历史的。
    done: !!FOCUS_ROOT,
    // 全图默认折叠:平铺 435 节点实测糊成屏幕中间一小片,什么关系都读不出来。
    // ego 子图(FOCUS_ROOT)本来就小,折了反而看不到卡。
    fold: !FOCUS_ROOT,
  };
  const cam = { x: 40, y: 110, k: 1 };
  let drag = null;
  let sel = null;

  let searchQuery = '';
  let matchIds = null;
  let searchHits = [];
  let activeHitIndex = -1;
  let searchDebounce = null;

  const graphEl = document.getElementById('graph');
  const stageEl = document.getElementById('stage');
  const svgEl = document.getElementById('edges');
  const nodesEl = document.getElementById('nodes');

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function roleVisible(role) {
    if (role === 'decision') return filters.decision;
    if (role === 'blocked') return filters.blocked;
    if (role === 'frontier') return filters.frontier;
    if (role === 'done') return filters.done;
    return filters.active;
  }
  function applyCam() {
    stageEl.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.k})`;
  }

  let lonelyCount = 0;
  function buildView() {
    let nodes = raw.nodes.filter(n => roleVisible(n.role) || (matchIds && matchIds.has(n.id)));
    const ids = new Set(nodes.map(n => n.id));
    const links = raw.links.filter(l => ids.has(l.source) && ids.has(l.target));
    lonelyCount = 0;
    // 折叠视图里,没有任何关系的功能不该占位置 —— 关系图的价值就是关系,
    // dagre 会把几十个孤立节点摊成一条横线,把仅有的几条真流转挤没。
    // 但**绝不静默丢**:数出来显示在顶栏(搜索命中的一律保留)。
    if (raw.folded && matchIds == null) {   // searching 是 render 内部的局部量,这里够不着
      const linked = new Set();
      links.forEach(l => { linked.add(l.source); linked.add(l.target); });
      const before = nodes.length;
      nodes = nodes.filter(n => linked.has(n.id));
      lonelyCount = before - nodes.length;
    }
    return { nodes, links };
  }

  function layout(data) {
    if (typeof dagre === 'undefined') throw new Error('dagre missing');
    const g = new dagre.graphlib.Graph({ multigraph: true });
    g.setGraph({ rankdir: 'TB', nodesep: 22, ranksep: 58, edgesep: 14, marginx: 24, marginy: 24 });
    g.setDefaultEdgeLabel(() => ({}));
    for (const n of data.nodes) g.setNode(n.id, { width: CARD_W, height: CARD_H });
    data.links.forEach((l, i) => {
      g.setEdge(l.source, l.target, { kind: l.kind, note: l.note }, String(i));
    });
    dagre.layout(g);
    return g;
  }

  function pathOf(pts) {
    if (!pts || pts.length < 2) return '';
    let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
    for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`;
    return d;
  }

  function render() {
    if (!raw) return;
    const data = buildView();
    if (window.__paintLonely) window.__paintLonely();   // 必须在 buildView 之后:它才算出 lonelyCount
    viewNodes = data.nodes;
    const g = layout(data);
    const gw = Math.max(g.graph().width || 0, 40);
    const gh = Math.max(g.graph().height || 0, 40);
    stageEl.style.width = gw + 'px';
    stageEl.style.height = gh + 'px';
    svgEl.setAttribute('width', gw);
    svgEl.setAttribute('height', gh);
    svgEl.setAttribute('viewBox', `0 0 ${gw} ${gh}`);
    svgEl.innerHTML = `
      <defs>
        <marker id="arr-dep" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="rgba(94,106,210,.7)"/>
        </marker>
      </defs>`;

    const searching = matchIds != null;
    for (const e of g.edges()) {
      const meta = g.edge(e);
      const pts = meta.points || [];
      const kind = meta.kind || '';
      const dim = searching && !(matchIds.has(e.v) || matchIds.has(e.w));
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', pathOf(pts));
      p.setAttribute('class', (kind === 'depends_on' ? 'edge-dep' : 'edge-rel') + (dim ? ' edge-dim' : ''));
      if (kind === 'depends_on') p.setAttribute('marker-end', 'url(#arr-dep)');
      svgEl.appendChild(p);
    }

    const byId = new Map(data.nodes.map(n => [n.id, n]));
    nodesEl.textContent = '';
    for (const n of data.nodes) {
      const pos = g.node(n.id);
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'gnode' + (n.flags?.done ? ' done' : '') + (n.is_root ? ' is-root' : '')
        + (n.role === 'decision' ? ' decision' : '')
        + (sel === n.id ? ' sel' : '');
      el.dataset.id = n.id;
      el.style.left = (pos.x - CARD_W / 2) + 'px';
      el.style.top = (pos.y - CARD_H / 2) + 'px';
      el.style.borderLeftColor = ROLE_COLOR[n.role] || ROLE_COLOR.open;
      if (searching) el.classList.add(matchIds.has(n.id) ? 'hit' : 'dim');
      if (n.kind === 'group') {
        // 组节点带组内信号,不是纯计数 —— 光写「71 张」帮不了人决定要不要点开
        const gt = n.decision ? `<span class="tag red">${n.decision} 等拍板</span>` : '';
        el.innerHTML = `
          <div class="gtitle">${escapeHtml(n.title)}</div>
          <div class="gid">${n.n} 张卡</div>
          <div class="gmeta">${gt}<span>${escapeHtml(n.status)}</span></div>`;
      } else {
      const tag = n.flags?.needs_decision && !n.flags?.done
        ? '<span class="tag red">等拍板</span>'
        : (n.status === 'staging-verified' ? '<span class="tag grey">验收</span>' : '');
      el.innerHTML = `
        <div class="gtitle">${escapeHtml(n.title || n.id)}</div>
        <div class="gid">${escapeHtml(n.id)}</div>
        <div class="gmeta">${tag}<span>${escapeHtml(n.status)}</span><span>${escapeHtml(n.owner || '无主')}</span></div>`;
      }
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        if (n.kind === 'group') {
          // 组不是卡,查详情会 404 —— 回看板并展开这一组
          try {
            const open = new Set(JSON.parse(localStorage.getItem('foldOpen') || '[]'));
            open.add(n.title);
            localStorage.setItem('foldOpen', JSON.stringify([...open]));
          } catch (e) {}
          location.href = '/';
          return;
        }
        select(n.id, true);
      });
      nodesEl.appendChild(el);
      n._el = el;
      n._pos = pos;
    }
    if (sel && byId.has(sel)) markSel(sel);
  }

  function markSel(id) {
    sel = id;
    nodesEl.querySelectorAll('.gnode.sel').forEach(e => e.classList.remove('sel'));
    const el = nodesEl.querySelector(`.gnode[data-id="${CSS.escape(id)}"]`);
    if (el) el.classList.add('sel');
  }

  function paintStats(s) {
    document.getElementById('stats').innerHTML = `
      <span class="chip">卡 <b>${s.total}</b></span>
      <span class="chip">边 <b>${s.edges}</b></span>
      <span class="chip">拍板 <b>${s.needs_decision}</b></span>
      <span class="chip">阻塞 <b>${s.blocked}</b></span>
      <span class="chip">frontier <b>${s.frontier}</b></span>
      <span class="chip">完成 <b>${s.done}</b></span>`;
  }
  function paintEgo(focus) {
    const bar = document.getElementById('ego-bar');
    if (!focus) { bar.classList.remove('on'); return; }
    bar.classList.add('on');
    document.getElementById('ego-root').textContent = focus.root;
    const meta = document.getElementById('ego-meta');
    meta.className = 'chip' + (focus.truncated ? ' warn' : '');
    meta.textContent = `↑${focus.upstream} ↓${focus.downstream}`
      + (focus.truncated ? ' · 已截断' : '');
    document.title = 'nawaban · DAG · ' + focus.root;
  }

  function showDetail(n) {
    const el = document.getElementById('detail');
    if (!n) { el.classList.remove('open'); return; }
    const tags = [];
    if (n.flags?.needs_decision) tags.push('<span class="tag red">等拍板</span>');
    if (n.flags?.blocked) tags.push('<span class="tag red">阻塞</span>');
    if (n.flags?.frontier) tags.push('<span class="tag grey">frontier</span>');
    if (n.flags?.done) tags.push('<span class="tag grey">done</span>');
    const blocked = (n.blocked_by || []).map(id => {
      const u = raw.nodes.find(x => x.id === id);
      return `<li data-id="${escapeHtml(id)}"><code>${escapeHtml(id)}</code> · ${escapeHtml(u ? u.title : '?')}</li>`;
    }).join('');
    el.innerHTML = `
      <h2>${escapeHtml(n.title)}</h2>
      <div class="id">${escapeHtml(n.id)}</div>
      <div class="tags">${tags.join('')}</div>
      <dl class="meta">
        <dt>status</dt><dd>${escapeHtml(n.status)}</dd>
        <dt>epic</dt><dd>${escapeHtml(n.epic || '∅')}</dd>
        <dt>owner</dt><dd>${escapeHtml(n.owner || '—')}</dd>
        <dt>waiting_on</dt><dd>${escapeHtml(n.waiting_on || '—')}</dd>
        <dt>now</dt><dd>${escapeHtml(n.now || '—')}</dd>
      </dl>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
        ${n.is_root ? '<span class="tag grey">当前根</span>'
          : `<a class="btn" href="/?view=dag&focus=${encodeURIComponent(n.id)}">以此为根</a>`}
      </div>
      ${blocked ? `<div style="font-size:11px;color:var(--dim);letter-spacing:.06em">被挡于</div><ul class="list">${blocked}</ul>` : ''}`;
    el.classList.add('open');
    el.querySelectorAll('.list li').forEach(li => {
      li.addEventListener('click', () => flyTo(li.getAttribute('data-id'), true));
    });
  }

  function select(id, open) {
    const n = viewNodes.find(x => x.id === id) || raw.nodes.find(x => x.id === id);
    markSel(id);
    if (open && n) showDetail(n);
  }

  function flyTo(id, open) {
    const n = viewNodes.find(x => x.id === id);
    if (!n || !n._pos) return false;
    const gw = graphEl.clientWidth, gh = graphEl.clientHeight;
    cam.k = Math.max(cam.k, 1);
    cam.x = gw / 2 - n._pos.x * cam.k;
    cam.y = gh / 2 - n._pos.y * cam.k;
    applyCam();
    select(id, open);
    return true;
  }

  function fit() {
    if (!viewNodes.length) return;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const n of viewNodes) {
      if (!n._pos) continue;
      minX = Math.min(minX, n._pos.x - CARD_W / 2);
      minY = Math.min(minY, n._pos.y - CARD_H / 2);
      maxX = Math.max(maxX, n._pos.x + CARD_W / 2);
      maxY = Math.max(maxY, n._pos.y + CARD_H / 2);
    }
    if (!Number.isFinite(minX)) return;
    const pad = 48;
    const bw = maxX - minX + pad * 2;
    const bh = maxY - minY + pad * 2;
    const gw = graphEl.clientWidth, gh = graphEl.clientHeight - 24;
    cam.k = Math.min(1.15, gw / bw, gh / bh);
    cam.x = (gw - bw * cam.k) / 2 - (minX - pad) * cam.k;
    cam.y = 100 + (gh - 100 - bh * cam.k) / 2 - (minY - pad) * cam.k;
    applyCam();
  }

  function scoreNode(n, tokens) {
    const id = (n.id || '').toLowerCase();
    const title = (n.title || '').toLowerCase();
    const owner = (n.owner || '').toLowerCase();
    const epic = (n.epic || '').toLowerCase();
    const status = (n.status || '').toLowerCase();
    let score = 0;
    const fields = new Set();
    for (const tok of tokens) {
      let hit = false;
      if (id === tok) { score += 100; fields.add('id'); hit = true; }
      else if (id.startsWith(tok)) { score += 60; fields.add('id'); hit = true; }
      else if (id.includes(tok)) { score += 40; fields.add('id'); hit = true; }
      if (title.includes(tok)) { score += title.startsWith(tok) ? 35 : 25; fields.add('title'); hit = true; }
      if (owner && owner.includes(tok)) { score += 30; fields.add('owner'); hit = true; }
      if (epic && epic.includes(tok)) { score += 28; fields.add('epic'); hit = true; }
      if (status.includes(tok)) { score += 22; fields.add('status'); hit = true; }
      if (!hit) return null;
    }
    return { score, fields: [...fields] };
  }

  function highlightText(text, tokens) {
    let out = escapeHtml(text || '');
    for (const tok of tokens) {
      if (!tok) continue;
      const re = new RegExp('(' + tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
      out = out.replace(re, '<mark>$1</mark>');
    }
    return out;
  }

  function renderHitList() {
    const box = document.getElementById('search-results');
    if (!searchQuery) { box.classList.remove('open'); box.innerHTML = ''; return; }
    if (!searchHits.length) {
      box.innerHTML = '<div class="empty">无匹配</div>';
      box.classList.add('open');
      return;
    }
    const tokens = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
    const slice = searchHits.slice(0, 80);
    box.innerHTML = slice.map((h, i) => {
      const n = h.node;
      const sub = [n.status, n.epic && n.epic !== '∅' ? n.epic : null, n.owner || 'unclaimed']
        .filter(Boolean).join(' · ');
      return `<div class="hit${i === activeHitIndex ? ' active' : ''}" data-idx="${i}">
        <span class="idx">${i + 1}</span>
        <span class="tid">${highlightText(n.id, tokens)}</span>
        <span class="ttl">${highlightText(n.title, tokens)}</span>
        <span class="sub">${escapeHtml(sub)}</span>
      </div>`;
    }).join('');
    box.classList.add('open');
    box.querySelectorAll('.hit').forEach(el => {
      el.addEventListener('mousedown', e => {
        e.preventDefault();
        jumpToHit(+el.getAttribute('data-idx'));
      });
    });
  }

  function runSearch(q) {
    searchQuery = (q || '').trim();
    const countEl = document.getElementById('search-count');
    const clearBtn = document.getElementById('btn-clear-q');
    if (!searchQuery) {
      matchIds = null; searchHits = []; activeHitIndex = -1;
      countEl.textContent = ''; countEl.className = '';
      clearBtn.classList.remove('show');
      document.getElementById('search-results').classList.remove('open');
      render();
      return;
    }
    clearBtn.classList.add('show');
    const tokens = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = [];
    for (const n of raw.nodes) {
      const r = scoreNode(n, tokens);
      if (r) hits.push({ id: n.id, score: r.score, fields: r.fields, node: n });
    }
    hits.sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
    searchHits = hits;
    matchIds = new Set(hits.map(h => h.id));
    activeHitIndex = hits.length ? 0 : -1;
    countEl.textContent = hits.length ? `${hits.length} 命中` : '0 命中';
    countEl.className = hits.length ? 'has-hits' : 'none';
    renderHitList();
    render();
  }

  function jumpToHit(idx) {
    if (!searchHits.length) return;
    activeHitIndex = ((idx % searchHits.length) + searchHits.length) % searchHits.length;
    renderHitList();
    flyTo(searchHits[activeHitIndex].id, true);
  }

  function wireSearch() {
    const input = document.getElementById('q');
    const box = document.getElementById('search-results');
    input.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        runSearch(input.value);
        if (searchHits.length === 1) flyTo(searchHits[0].id, true);
      }, 120);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (input.value) { input.value = ''; runSearch(''); }
        else { input.blur(); box.classList.remove('open'); }
        return;
      }
      if (e.key === 'ArrowDown') { e.preventDefault(); jumpToHit(activeHitIndex + 1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); jumpToHit(activeHitIndex - 1); }
      if (e.key === 'Enter' && searchHits.length) { e.preventDefault(); jumpToHit(activeHitIndex); }
    });
    input.addEventListener('focus', () => { if (searchQuery) box.classList.add('open'); });
    document.getElementById('btn-clear-q').addEventListener('click', () => {
      input.value = ''; runSearch(''); input.focus();
    });
    window.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== input && document.activeElement?.tagName !== 'INPUT') {
        e.preventDefault(); input.focus(); input.select();
      }
      if (e.key === 'Escape' && document.activeElement !== input) {
        showDetail(null);
      }
    });
  }

  function wirePanZoom() {
    graphEl.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
      const nk = Math.min(2.2, Math.max(0.22, cam.k * factor));
      const rect = graphEl.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      cam.x = cx - (cx - cam.x) * (nk / cam.k);
      cam.y = cy - (cy - cam.y) * (nk / cam.k);
      cam.k = nk;
      applyCam();
    }, { passive: false });
    graphEl.addEventListener('pointerdown', e => {
      if (e.target.closest('.gnode') || e.target.closest('.hud')) return;
      drag = { x: e.clientX - cam.x, y: e.clientY - cam.y };
      graphEl.classList.add('drag');
      graphEl.setPointerCapture(e.pointerId);
    });
    graphEl.addEventListener('pointermove', e => {
      if (!drag) return;
      cam.x = e.clientX - drag.x;
      cam.y = e.clientY - drag.y;
      applyCam();
    });
    const end = () => { drag = null; graphEl.classList.remove('drag'); };
    graphEl.addEventListener('pointerup', end);
    graphEl.addEventListener('pointercancel', end);
    graphEl.addEventListener('click', e => {
      if (!e.target.closest('.gnode')) showDetail(null);
    });
  }

  async function loadGraph() {
    const qs = new URLSearchParams();
    if (FOCUS_ROOT) qs.set('root', FOCUS_ROOT);
    if (filters.fold && !FOCUS_ROOT) qs.set('fold', '1');
    const res = await fetch('/api/graph' + (qs.toString() ? '?' + qs : ''));
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `API ${res.status}`);
    }
    raw = await res.json();
    window.__paintLonely = () => {
      const el = document.getElementById('lonely-chip');
      if (el) el.textContent = lonelyCount ? `另有 ${lonelyCount} 个功能无依赖关系` : '';
    };
    paintStats(raw.folded
      ? { ...raw.stats, total: raw.stats.folded_groups, edges: raw.stats.folded_edges }
      : raw.stats);
    paintEgo(raw.focus);
  }

  async function main() {
    if (typeof dagre === 'undefined') throw new Error('dagre 没加载 · vendor/dagre-0.8.5.min.js');
    if (FOCUS_ROOT) {
      document.getElementById('loading').textContent = '本卡关系 · ' + FOCUS_ROOT;
    }
    await loadGraph();
    render();
    applyCam();
    fit();
    if (FOCUS_ROOT) flyTo(FOCUS_ROOT, true);
    document.getElementById('loading').classList.add('hidden');
    wireSearch();
    wirePanZoom();

    const bind = (id, key) => {
      document.getElementById(id).addEventListener('change', e => {
        filters[key] = e.target.checked;
        render();
        fit();
      });
    };
    bind('f-decision', 'decision');
    bind('f-blocked', 'blocked');
    bind('f-frontier', 'frontier');
    bind('f-active', 'active');
    bind('f-done', 'done');
    const foldWrap = document.getElementById('fold-wrap');
    if (FOCUS_ROOT) foldWrap.style.display = 'none';   // ego 子图本来就小,折了反而看不到卡
    document.getElementById('f-fold').checked = filters.fold;
    document.getElementById('f-done').checked = filters.done;
    document.getElementById('f-fold').addEventListener('change', async e => {
      filters.fold = e.target.checked;
      await loadGraph();
      render();
      fit();
    });
    document.getElementById('btn-fit').addEventListener('click', fit);
    window.addEventListener('resize', () => fit());
  }

  main().catch(err => {
    document.getElementById('loading').textContent = '失败 · ' + err.message;
    console.error(err);
  });
})();
</script>
</body>
</html>
